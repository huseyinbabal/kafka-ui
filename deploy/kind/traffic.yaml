# Dev-only demo traffic for analytics and the live view (e2e- prefixed, safe to delete):
# a producer at ~20 msg/s and a deliberately slower consumer so lag is visible.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-traffic-producer
  namespace: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels: {app: e2e-traffic-producer}
  template:
    metadata:
      labels: {app: e2e-traffic-producer}
    spec:
      containers:
        - name: producer
          image: quay.io/strimzi/kafka:1.3.1-kafka-4.3.2
          command: ["/opt/kafka/bin/kafka-producer-perf-test.sh"]
          args:
            - --topic=e2e-traffic
            - --num-records=1000000000
            - --record-size=300
            - --throughput=20
            - --producer-props
            - bootstrap.servers=orders-cluster-kafka-bootstrap.kafka.svc:9092
            - client.id=e2e-traffic-producer
          resources:
            requests: {memory: 256Mi, cpu: 50m}
            limits: {memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-traffic-consumer
  namespace: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels: {app: e2e-traffic-consumer}
  template:
    metadata:
      labels: {app: e2e-traffic-consumer}
    spec:
      containers:
        - name: consumer
          image: quay.io/strimzi/kafka:1.3.1-kafka-4.3.2
          # Reads in short bursts with pauses, so it falls slowly behind the producer.
          command: ["/bin/bash", "-c"]
          args:
            - |
              while true; do
                /opt/kafka/bin/kafka-console-consumer.sh \
                  --bootstrap-server orders-cluster-kafka-bootstrap.kafka.svc:9092 \
                  --topic e2e-traffic --group e2e-slow-consumer \
                  --consumer-property client.id=e2e-slow-consumer \
                  --max-messages 150 --timeout-ms 20000 > /dev/null 2>&1
                sleep 6
              done
          resources:
            requests: {memory: 256Mi, cpu: 50m}
            limits: {memory: 512Mi}
