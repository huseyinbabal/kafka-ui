<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="kafka-ui">
  <defs>
    <linearGradient id="kui-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4c9bf5"/>
      <stop offset="1" stop-color="#1b55ad"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#kui-bg)"/>
  <!-- the log: stacked record segments form the stem of the K -->
  <rect x="15" y="13" width="9" height="11" rx="2.5" fill="#fff"/>
  <rect x="15" y="26.5" width="9" height="11" rx="2.5" fill="#fff" fill-opacity=".85"/>
  <rect x="15" y="40" width="9" height="11" rx="2.5" fill="#fff" fill-opacity=".7"/>
  <!-- streams flowing out to consumers form the arms -->
  <path d="M26.5 32 C36 32 37 18.5 45.5 17.5" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M26.5 32 C36 32 37 45.5 45.5 46.5" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="49" cy="17" r="4.5" fill="#fff"/>
  <circle cx="49" cy="47" r="4.5" fill="#fff"/>
</svg>
